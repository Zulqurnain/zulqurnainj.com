server {
    listen 80;
    server_name zulqurnainj.com www.zulqurnainj.com;
    return 301 https://zulqurnainj.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.zulqurnainj.com;
    ssl_certificate /etc/letsencrypt/live/zulqurnainj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zulqurnainj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://zulqurnainj.com$request_uri;
}

server {
    listen 443 ssl;
    server_name zulqurnainj.com;

    ssl_certificate /etc/letsencrypt/live/zulqurnainj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zulqurnainj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zulqurnainj.com/out;
    index index.html;

    include /etc/nginx/snippets/block-scanners.conf;

    limit_req zone=general burst=40 nodelay;
    limit_conn perip 30;

    location /dummyflights/ {
        rewrite ^/dummyflights/(.*)$ https://dummyflight.zulqurnainj.com/$1 permanent;
    }
    location = /dummyflights { return 301 https://dummyflight.zulqurnainj.com/; }

    location /admin/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
        include /etc/nginx/snippets/proxy-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
    }
    location = /admin { return 301 /admin/; }


    location /chat/api/auth/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/(.*)$ /chat/api/$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        client_max_body_size 10m;
        include /etc/nginx/snippets/proxy-security-headers.conf;
    }

    location = /chat/sitemap.xml { alias /var/www/nayab-static/sitemap.xml; add_header Content-Type "application/xml"; }
    location = /chat/llms.txt    { alias /var/www/nayab-static/llms.txt;    add_header Content-Type "text/plain; charset=utf-8"; }
    location = /chat/robots.txt  { alias /var/www/nayab-static/robots.txt;  add_header Content-Type "text/plain; charset=utf-8"; }
    location = /chat/index.md    { alias /var/www/nayab-static/index.md;    types {} default_type "text/markdown; charset=utf-8"; }

    # Only the actual LLM-inference call is rate-limited here -- a single page
    # load/navigation legitimately fires far more than 5 parallel requests
    # (JS chunks, Next.js Link-hover RSC prefetches), which was tripping this
    # zone when it covered the whole /chat prefix and 503'ing static assets,
    # crashing the app client-side with ChunkLoadError on every page.
    location /chat/api/chat {
        limit_req zone=chat_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        client_max_body_size 3m;
        include /etc/nginx/snippets/proxy-security-headers.conf;
    }

    location /chat {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
        client_max_body_size 3m;
        include /etc/nginx/snippets/proxy-security-headers.conf;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        include /etc/nginx/snippets/proxy-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(md|txt)$ {
        add_header Content-Type 'text/plain; charset=utf-8';
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/proxy-security-headers.conf;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404/index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
